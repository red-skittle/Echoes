services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: afterlife
      POSTGRES_PASSWORD: afterlife
      POSTGRES_DB: afterlife
    ports:
      - "5432:5432"
    volumes:
      - afterlife-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterlife -d afterlife"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - afterlife-redis:/data
volumes:
  afterlife-postgres:
  afterlife-redis:
